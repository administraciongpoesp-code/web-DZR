<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .whatsapp-button {
            position: fixed;
            width: 60px;
            height: 60px;
            bottom: 40px;
            right: 40px;
            background-color: #25d366;
            color: #fff;
            border-radius: 50px;
            text-align: center;
            font-size: 30px;
            box-shadow: 2px 2px 3px #999;
            z-index: 1000;
        }

        .whatsapp-button a {
            color: #fff;
            text-decoration: none;
            display: block;
            height: 100%;
            width: 100%;
            line-height: 60px;
        }
    </style>
</head>
<body>
    <div class="whatsapp-button">
        <a href="https://wa.me/1234567890" target="_blank">💬</a>
    </div>
</body>
</html>
