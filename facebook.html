<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incrustar Página de Facebook</title>
</head>
<body>
    <h1>Mi Página de Facebook</h1>
    
    <!-- Contenedor del plugin de la página de Facebook -->
    <div id="fb-root"></div>
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/es_ES/sdk.js#xfbml=1&version=v16.0"></script>
    
    <div class="fb-page" 
         data-href="https://www.facebook.com/DZRSPORT" 
         data-tabs="timeline"
         data-width="500" 
         data-height="600" 
         data-small-header="false" 
         data-adapt-container-width="true" 
         data-hide-cover="false" 
         data-show-facepile="true"
         data-lazy="true">
        <blockquote cite="https://www.facebook.com/DZRSPORT" class="fb-xfbml-parse-ignore">
            <a href="https://www.facebook.com/DZRSPORT">DEZARA</a>
        </blockquote>
    </div>
    
</body>
</html>
